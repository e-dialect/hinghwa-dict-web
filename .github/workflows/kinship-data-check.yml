name: Kinship data contract
on:
  pull_request:
    paths:
      - 'package.json'
      - 'src/data/kinship/**'
      - 'src/components/Tools/RelativeSelect.vue'
      - 'src/views/Tools/Relative.vue'
      - 'src/components/Tools/relative.js'
      - 'src/components/Tools/relativeWords.js'
      - 'src/pages/tools/relative.vue'
      - 'src/components/WordListShowing.vue'
      - 'src/services/relative.js'
      - 'src/services/relativeWords.js'
      - 'scripts/*kinship*.mjs'
      - 'scripts/check-relative.mjs'
      - '.github/workflows/kinship-data-check.yml'
  push:
    branches:
      - master
    paths:
      - 'package.json'
      - 'src/data/kinship/**'
      - 'src/components/Tools/RelativeSelect.vue'
      - 'src/views/Tools/Relative.vue'
      - 'src/components/Tools/relative.js'
      - 'src/components/Tools/relativeWords.js'
      - 'src/pages/tools/relative.vue'
      - 'src/components/WordListShowing.vue'
      - 'src/services/relative.js'
      - 'src/services/relativeWords.js'
      - 'scripts/*kinship*.mjs'
      - 'scripts/check-relative.mjs'
      - '.github/workflows/kinship-data-check.yml'

jobs:
  local-contract:
    runs-on: ubuntu-latest
    outputs:
      paired: ${{ steps.scope.outputs.paired }}
    steps:
      - name: Checkout current frontend
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Determine whether shared files require a paired PR
        if: github.event_name == 'pull_request'
        id: scope
        run: node scripts/kinship-ci-scope.mjs "${{ github.event.pull_request.base.sha }}"
      - name: Validate local data, engine and component behavior
        run: npm run check:kinship-module

  paired-contract:
    if: github.event_name == 'pull_request' && needs.local-contract.outputs.paired == 'true'
    needs: local-contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current frontend
        uses: actions/checkout@v4
        with:
          path: current
      - name: Checkout matching peer frontend
        uses: actions/checkout@v4
        with:
          repository: e-dialect/hinghwa-dict-uni-app
          ref: ${{ vars.KINSHIP_PEER_REF || github.head_ref }}
          path: peer
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate shared data, modules and tests against paired PR branch
        working-directory: current
        run: npm run check:kinship-module -- ../peer
